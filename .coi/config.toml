# code-on-incus config for Psi-Omega-Website — <psi-omega-website>/.coi/config.toml (project config → run `coi trust`).
# VL-free, secret-free (token injected via env). Daytime base; night profile is a separate file (later).
# Validated against `coi schema profile` on the installed COI (7.3) — not the wiki (stale on forward_env).

[container]
image      = "coi-default"   # Node 22 + pnpm + jq + git; only chromium missing (defer)
persistent = true            # kept running when you leave → reconnect with `coi attach`; `coi shutdown` still deletes it
alias      = "psi-omega-website"

[tool]
name            = "claude"
permission_mode = "bypass"   # == --dangerously-skip-permissions; safe only because the container is the boundary

[limits.cpu]
count     = "4"      # pinned vCPUs; may overlap with other projects' — idle containers cost nothing
allowance = "80%"    # soft share, so the guest OS + COI monitor aren't starved

[limits.memory]
limit = "4GiB"       # other projects' 12 + psi 4 must fit the VM (22 GiB) with room to spare
swap  = "2GiB"

[limits.runtime]
max_processes = 2048   # integer, not a quoted string; the default of 300 SIGABRTs a second session
# max_duration — night profile only

[network]
mode = "restricted"

# Own port band: 5173+ is the Mac's. Host pinned to container so
# localhost:7173 on the Mac is the same server. Run the dev server on 7173 inside the container.
[[ports.map]]
name      = "vite"
container = 7173
host      = 7173
[[ports.map]]
name      = "vite1"
container = 7174
host      = 7174
[[ports.map]]
name      = "vite2"
container = 7175
host      = 7175

[monitoring]
enabled               = true
poll_interval_sec     = 2
auto_pause_on_high    = true
auto_kill_on_critical = true
# 50 / 10 froze a session 2 min in on normal startup reads (apertur's values.
file_read_threshold_mb    = 500
file_read_rate_mb_per_sec = 250

[monitoring.nft]
enabled               = true
rate_limit_per_second = 100
dns_query_threshold   = 100
log_dns_queries       = true
# lima_host = "incus"   # [VERIFY empirically] enable Mac network monitoring; test in a throwaway shell first